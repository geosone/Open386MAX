; ReBIOS settings for the MAXPROBE stick (see README.TXT)
; Einstellungen von ReBIOS fuer den MAXPROBE-Stick (siehe README.TXT)
;
; Start MAXPROBE from this stick, not from another drive:
boot_drive = self
;
; ReBIOS emulates a VGA (VBE vendor "ReBIOS") when the graphics have no
; usable VGA BIOS, and for graphics in the processor or on the board from
; 2018 on.  To probe their own VGA BIOS instead (the screen may stay dark):
; vga_emulation = never
;
; The card's VGA BIOS as a file:
; vgabios = \EFI\BOOT\VGABIOS.BIN
